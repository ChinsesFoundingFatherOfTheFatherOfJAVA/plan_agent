<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>插单管理</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333}.nav-top{background:#fff;padding:10px 24px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}.nav-top a{color:#1677ff;text-decoration:none;font-size:14px}.nav-top .title{font-size:16px;font-weight:600;margin-right:auto}.content{padding:24px;max-width:1200px;margin:0 auto}.btn{padding:6px 16px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;cursor:pointer;font-size:13px;transition:all .2s}.btn:hover{border-color:#4096ff;color:#4096ff}.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}.card h3{font-size:14px;color:#666;margin-bottom:12px}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#fafafa;padding:10px 12px;text-align:left;font-weight:600;color:#666;border-bottom:2px solid #e8e8e8}td{padding:8px 12px;border-bottom:1px solid #f0f0f0}tr:hover td{background:#f5f5f5}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}.badge-high{background:#fff2f0;color:#ff4d4f}.badge-medium{background:#fffbe6;color:#faad14}.badge-low{background:#f6ffed;color:#52c41a}.badge-active{background:#e6f4ff;color:#1677ff}.badge-resolved{background:#f5f5f5;color:#999}.badge-draft{background:#fffbe6;color:#faad14}.badge-confirmed{background:#f6ffed;color:#52c41a}.empty{text-align:center;padding:60px;color:#999}.empty .icon{font-size:48px;margin-bottom:12px}.loading{display:none;text-align:center;padding:40px;color:#999}.bar-container{width:100px;height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}.bar-fill{height:100%;border-radius:4px;transition:width .3s}.expand-row{cursor:pointer}.expand-row:hover{background:#e6f4ff!important}.detail-row{display:none}.detail-row.show{display:''}.affected-task{padding:4px 12px;margin:2px 0;background:#fafafa;border-radius:4px;font-size:12px}</style>
</head>
<body>
<div class="nav-top"><a href="/">← 首页</a><span class="title">📥 插单管理</span><button class="btn btn-primary" onclick="loadData()">刷新</button></div>
<div class="content">
    <div class="card"><h3>插单历史记录</h3><div id="tableDiv"><div class="empty"><div class="icon">📊</div><div>加载中...</div></div></div></div>
</div>
<script>
async function loadData(){
    try{
        const r=await fetch('/api/insert-orders');const d=await r.json();
        if(!d.count){document.getElementById('tableDiv').innerHTML='<div class="empty"><div class="icon">📥</div><div>暂无插单记录</div><div style="font-size:13px;margin-top:8px;">通过 API /api/orders/insert 发起插单</div></div>';return}
        let t='<table><thead><tr><th>记录ID</th><th>订单号</th><th>原计划</th><th>新计划</th><th>扰动评分</th><th>扰动等级</th><th>受影响任务</th><th>状态</th><th>时间</th></tr></thead><tbody>';
        d.items.forEach((i,idx)=>{
            const ds=i.disruption_score?parseFloat(i.disruption_score).toFixed(1):'-';
            const dc=i.disruption_level==='high'?'#ff4d4f':i.disruption_level==='medium'?'#faad14':'#52c41a';
            t+='<tr class="expand-row" onclick="toggleDetail('+idx+')"><td>'+i.log_id+'</td><td>'+i.order_id+'</td><td>'+(i.original_plan_id||'-')+'</td><td>'+(i.new_plan_id||'-')+'</td><td style="color:'+dc+';font-weight:600;">'+ds+'</td><td><span class="badge badge-'+(i.disruption_level||'low')+'">'+(i.disruption_level||'-')+'</span></td><td>'+(i.affected_tasks?i.affected_tasks.length:0)+'</td><td><span class="badge badge-'+i.status+'">'+i.status+'</span></td><td>'+(i.created_at||'').slice(0,19)+'</td></tr>';
            if(i.affected_tasks&&i.affected_tasks.length){
                t+='<tr class="detail-row" id="detail-'+idx+'"><td colspan="9" style="background:#fafafa;">';
                i.affected_tasks.forEach(at=>{
                    const dm=at.delay_minutes||0;t+='<div class="affected-task"><strong>'+at.task_id+'</strong> | 影响:'+(at.impact_type||'-')+' | 延迟:'+dm+'分钟 | '+(at.old_start_time||'').slice(0,16)+' → '+(at.new_start_time||'').slice(0,16)+'</div>'});
                t+='</td></tr>'
            }
        });
        t+='</tbody></table>';
        document.getElementById('tableDiv').innerHTML=t;
    }catch(e){document.getElementById('tableDiv').innerHTML='<div class="empty"><div>加载失败: '+e.message+'</div></div>'}
}
function toggleDetail(idx){const r=document.getElementById('detail-'+idx);if(r)r.classList.toggle('show')}
loadData();
</script>
</body></html>
